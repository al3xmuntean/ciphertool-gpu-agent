# Builds the GPU agent image (tools/gpu_agent) and pushes it to GHCR. Only on request, publishing is a deliberate act:
# a manual run, or pushing a tag gpu-agent-seedvr2-v* / gpu-agent-full-v*.
name: gpu-agent-image

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Image target"
        type: choice
        options: [seedvr2, full]
        default: seedvr2
  push:
    tags: ["gpu-agent-seedvr2-v*", "gpu-agent-full-v*"]

env:
  TARGET: ${{ inputs.target || (startsWith(github.ref_name, 'gpu-agent-full-') && 'full') || 'seedvr2' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      # The CUDA images plus two torch builds need far more than the runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ env.TARGET }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ciphertool-gpu-agent:${{ env.TARGET }}
            ghcr.io/${{ github.repository_owner }}/ciphertool-gpu-agent:${{ env.TARGET }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=CipherTool GPU agent (${{ env.TARGET }})
          cache-from: type=gha,scope=${{ env.TARGET }}
          cache-to: type=gha,mode=max,scope=${{ env.TARGET }}
